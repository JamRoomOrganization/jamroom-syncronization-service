sonar.projectKey=JamRoomOrganization_jamroom-syncronization-service
sonar.organization=jamroomorganization
sonar.projectName=jamroom-syncronization-service

# Codificación
sonar.sourceEncoding=UTF-8

# Código fuente y tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Exclusiones generales de análisis
sonar.exclusions=**/__tests__/**,**/node_modules/**,coverage/**,jest.config.js,*.config.js

# Cobertura generada por Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de cobertura
sonar.coverage.exclusions=\
  src/**/__tests__/**,\
  src/**/index.js,\
  src/test*.js,\
  src/scripts/**,\
  src/server.js,\
  src/config/redis.js,\
  src/sockets/syncGateway.js,\
  src/utils/requestLogger.js,\
  src/utils/metrics.js,\
  src/utils/rateLimiter.js,\
  src/utils/retryWithBackoff.js,\
  src/utils/streamUrlCache.js