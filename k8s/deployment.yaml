apiVersion: apps/v1
kind: Deployment
metadata:
  name: jamroom-sync-service
  labels:
    app: jamroom-sync
    tier: backend
spec:
  replicas: 3  # Horizontal scaling for HA
  selector:
    matchLabels:
      app: jamroom-sync
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jamroom-sync
        tier: backend
    spec:
      containers:
      - name: sync-api
        image: your-registry/jamroom-sync-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP

        env:
        # Redis configuration (use ConfigMap or Secrets in production)
        - name: REDIS_MODE
          value: "standalone"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: url
        - name: REDIS_TLS
          value: "true"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
              optional: true

        # Application settings
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"

        # CORS configuration
        - name: ALLOWED_ORIGINS
          value: "https://yourapp.com,https://www.yourapp.com"

        # Multi-instance support (required for k8s)
        - name: ALLOW_SINGLE_NODE
          value: "false"

        # Readiness probe: checks if Redis is healthy
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        # Liveness probe: checks if process is alive
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        # Resource limits
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Node.js may need temp files
          capabilities:
            drop:
            - ALL

---
# Example Secret for Redis credentials
# In production, use external secret management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
type: Opaque
stringData:
  url: rediss://your-redis.example.com:6379
  password: your-redis-password-here

