apiVersion: v1
kind: Service
metadata:
  name: jamroom-sync-service
  labels:
    app: jamroom-sync
    tier: backend
spec:
  type: ClusterIP  # Use LoadBalancer for external access, or Ingress
  selector:
    app: jamroom-sync
  ports:
  - name: http
    port: 80
    targetPort: 3001
    protocol: TCP
  sessionAffinity: None  # Socket.IO sessions managed via Redis adapter

---
# Optional: Ingress for external HTTPS access
# Requires Ingress controller (nginx, traefik, etc.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jamroom-sync-ingress
  annotations:
    # Example: nginx ingress
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "jamroom-sync-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # Example: cert-manager for TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sync-api.yourapp.com
    secretName: jamroom-sync-tls
  rules:
  - host: sync-api.yourapp.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jamroom-sync-service
            port:
              number: 80

---
# Optional: HorizontalPodAutoscaler for auto-scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jamroom-sync-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jamroom-sync-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
# Optional: PodDisruptionBudget for high availability during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jamroom-sync-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: jamroom-sync

